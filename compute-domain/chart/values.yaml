# Values for microsoft.managedcomputedomain.
# The consumer is the AKS core-extension helm runner (not the public); the Azure.*
# block is injected by the extension system at install time (see dranet's chart).

# Namespace the controller runs in. kube-system matches the managed-dranet model.
namespace: kube-system

image:
  # Compute-domain controller image (contains BOTH compute-domain-controller and
  # compute-domain-daemon; the controller spawns the daemon DaemonSet from this same
  # image via the IMAGE_NAME env). Onboarded via dalec/MCR.
  repository: mcr.microsoft.com/oss/v2/nvidia/compute-domain-controller
  tag: "v0.5.0"
  pullPolicy: IfNotPresent

# IMEX deployment mode. driverManaged = the controller creates a per-ComputeDomain
# compute-domain-daemon DaemonSet that runs nvidia-imex (host binary via CDI).
# hostManaged is intentionally NOT supported by this managed chart: it would require
# AKS to own host IMEX topology (nodes_config.cfg) which is impossible at node
# bootstrap and duplicates what the DaemonSet does for free.
imex:
  mode: driverManaged
  isolation: domain

logVerbosity: 4

controller:
  replicas: 1
  priorityClassName: system-cluster-critical
  leaderElection:
    enabled: true
    leaseDuration: "15s"
    renewDeadline: "10s"
    retryPeriod: "2s"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

# Feature gates passed to the controller (FEATURE_GATES env). Left empty = upstream
# defaults (IMEXDaemonsWithDNSNames on, requires driver >= 570.158 which R580 satisfies).
featureGates: {}
